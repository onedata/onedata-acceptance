[tool.black]
line-length = 88
target-version = ['py312']
fast = true
include = '\.pyi?$'
# 'extend-exclude' excludes files or directories in addition to the defaults
extend-exclude = '''
# A regex preceded with ^/ will apply only to files and directories
# in the root of the project.
(
  | gui/utils/__init__\.py
)
'''
preview = true
enable-unstable-feature = ["string_processing"]

[tool.isort]
py_version = 312
profile = "black"                  # Use Black's import style
line_length = 88                   # Maximum line length for imports
overwrite_in_place = true
skip = ["tests/gui/utils/__init__.py"]
known_first_party = ["tests", "bamboos"]

[tool.mypy]
python_version = "3.12"
warn_unused_configs = true        # flag a config/override section that matches no files
warn_unused_ignores = true        # flag a `# type: ignore` that no longer applies
warn_redundant_casts = true       # flag casts that do nothing
disallow_untyped_defs = true      # every function must be annotated
disallow_incomplete_defs = true   # …and partially-annotated functions are an error too
strict_equality = true            # flag comparisons between non-overlapping types
no_implicit_optional = true       # `x: int = None` is an error, not implicit Optional

# TODO: VFS-13659 uncomment after final typing fixes
# warn_return_any = true            # flag returning Any from a typed function

# TODO: VFS-13660 remove after final typing fixes
follow_imports = "skip"

pretty = true
show_error_codes = true

[[tool.mypy.overrides]]
module = ["bamboos.*"]
follow_imports = "skip"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = [
    "py.xml",
    "jsondiff",
    "fs.onedatafs",
    "environment",
    "environment.*",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = [
    "kubernetes",
    "kubernetes.*",
    "rpyc",
    "rpyc.*",
    "aiohttp_sse_client",
    "aiohttp_sse_client.*",
    "xmlrunner",
    "xmlrunner.*",
    "tests.utils.onenv_utils",
    "tests.utils.user_utils",
    "tests.mixed.utils.sse_utils",
    "tests.onedata_fs.unit_tests.test_onedatafs",
]
ignore_missing_imports = true
disable_error_code = ["import-untyped"]

# TODO: VFS-13661 move all submodules into one place
# Ignore generated / external REST clients reported by mypy logs.
[[tool.mypy.overrides]]
module = [
    "onezone_client",
    "onezone_client.*",
    "onepanel_client",
    "onepanel_client.*",
    "oneprovider_client",
    "oneprovider_client.*",
    "cdmi_client",
    "cdmi_client.*",
    "tests.mixed.onezone_client",
    "tests.mixed.onezone_client.*",
    "tests.mixed.onepanel_client",
    "tests.mixed.onepanel_client.*",
    "tests.mixed.oneprovider_client",
    "tests.mixed.oneprovider_client.*",
    "tests.mixed.cdmi_client",
    "tests.mixed.cdmi_client.*",
]
ignore_missing_imports = true
follow_imports = "skip"
ignore_errors = true
