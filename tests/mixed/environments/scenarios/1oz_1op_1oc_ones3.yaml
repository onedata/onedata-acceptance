spaces: false

oneclients: true

os-config:
  cfg1: &cfg1
    users:
      - user1
    groups:
      space1:
        - user1
      space2:
        - user1
      fuse:
        - user1
  services:
    oneprovider-1: *cfg1
    oneclient: *cfg1


oneclient:
  oneclient-1:
    clients:
      client1:
        provider: "oneprovider-1"
        mode: proxyio
        default timeout: 10

oneprovider-1:
  batchConfig:
    createUsers: false
  oneclient:
    users: []
    wait_for_oneprovider:
      enabled: false
  oneS3:
    enabled: true

onezone:
  batchConfig:
    createUsers: false