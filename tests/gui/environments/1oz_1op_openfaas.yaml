# Name of the scenario to run
scenario: "scenario-1oz-1op"

spaces: false

openfaas: true

storages:
  - s3

# OpenFaaS Pod Status Monitor image to use.
openfaasPodStatusMonitorImage: "docker.onedata.org/openfaas-pod-status-monitor:ID-998630eb48"

# OpenFaaS Lambda Result Streamer image to use.
openfaasLambdaResultStreamerImage: "docker.onedata.org/openfaas-lambda-result-streamer:ID-71762abfb7"

onezone:
  batchConfig:
    createUsers: false

oneprovider-1:
  batchConfig:
    createUsers: false
  workerOverlayConfig: |-
    [{op_worker, [
      {atm_logger_dump_to_op_logs, true},
      {atm_openfaas_function_removal_strategy, never},
      {openfaas_oneclient_options, "-v 3 --message-trace-log"},
      {file_upload_verbose_logs_enabled, true}
    ]}].
