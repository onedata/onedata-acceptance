  oneprovider: 20.02.19-jq
  # NOTE: RPYC version in initial image must be compatible with RPYC version in test runner image (onedata/acceptance_mixed)
  oneclient: 20.02.19-rpyc_5.0.1
targetVersions:
  onezone:
    sources:
      baseImage: develop
      components:
        - panel
        - worker
        - cluster-manager
  oneprovider:
    sources:
      baseImage: develop
      components:
        - panel
        - worker
        - cluster-manager
  # NOTE: RPYC version in target image must be compatible with RPYC version in test runner image (onedata/acceptance_mixed)
