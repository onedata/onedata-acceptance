scenarios:  # names of files in `environments/scenarios` directory without .yaml suffix
  - 1op
  - 2op
initialVersions:
  onezone: 25.0
  oneprovider: 25.0
  # NOTE: RPYC version in initial image must be compatible with RPYC version in test runner image (onedata/acceptance_mixed)
  oneclient: 25.0
targetVersions:
  onezone:
    sources:
      baseImage: develop
      components:
        - panel
        - worker
        - cluster-manager
  oneprovider:
    sources:
      baseImage: develop
      components:
        - panel
        - worker
        - cluster-manager
  # NOTE: RPYC version in target image must be compatible with RPYC version in test runner image (onedata/acceptance_mixed)
  oneclient: default
