version: 2
plan:
  project-key: ODSRV
  key: DMA
  name: demo mode acceptance
variables:
  release: "25.1"
stages:
- Demo mode tests:
    manual: false
    final: false
    jobs:
    - Comprehensive example
    - Distributed environment
    - Persistency
    - Python access
    - Run in background
    - Run in foreground

Comprehensive example:
  key: CEX
  other: &common-opts
    clean-working-dir: true
  tasks:
  - checkout: &checkout-default-repository
      path: onedata-acceptance
      force-clean-build: true
      description: Checkout Default Repository
  - script: &run-demo-mode-test
      interpreter: SHELL
      scripts:
      - make test_demo_mode RELEASE="${bamboo.release}" SCENARIO=test_comprehensive_example
      working-dir: onedata-acceptance
      description: Run demo mode test
  requirements: &requirements
  - system.docker.executable
  artifact-subscriptions: []

Distributed environment:
  key: DISTENV
  other: *common-opts
  tasks:
  - checkout: *checkout-default-repository
  - script:
      <<: *run-demo-mode-test
      scripts:
      - make test_demo_mode RELEASE="${bamboo.release}" SCENARIO=test_distributed_environment
  requirements: *requirements
  artifact-subscriptions: []

Persistency:
  key: PERSIST
  other: *common-opts
  tasks:
  - checkout: *checkout-default-repository
  - script:
      <<: *run-demo-mode-test
      scripts:
      - make test_demo_mode RELEASE="${bamboo.release}" SCENARIO=test_persistency
  requirements: *requirements
  artifact-subscriptions: []

Python access:
  key: PYACCESS
  other: *common-opts
  tasks:
  - checkout: *checkout-default-repository
  - script:
      <<: *run-demo-mode-test
      scripts:
      - make test_demo_mode RELEASE="${bamboo.release}" SCENARIO=test_python_access
  requirements: *requirements
  artifact-subscriptions: []

Run in background:
  key: BACKGROUND
  other: *common-opts
  tasks:
  - checkout: *checkout-default-repository
  - script:
      <<: *run-demo-mode-test
      scripts:
      - make test_demo_mode RELEASE="${bamboo.release}" SCENARIO=test_run_in_background
  requirements: *requirements
  artifact-subscriptions: []

Run in foreground:
  key: FOREGROUND
  other: *common-opts
  tasks:
  - checkout: *checkout-default-repository
  - script:
      <<: *run-demo-mode-test
      scripts:
      - make test_demo_mode RELEASE="${bamboo.release}" SCENARIO=test_run_in_foreground
  requirements: *requirements
  artifact-subscriptions: []

repositories:
- onedata-acceptance:
    scope: global
triggers:
- bitbucket-server-trigger
branches:
  create: manually
  delete: never
  link-to-jira: true
notifications: []
labels: []
dependencies:
  require-all-stages-passing: false
  enabled-for-branches: true
  block-strategy: none
  plans: []
other:
  concurrent-build-plugin: system-default
