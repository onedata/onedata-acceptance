version: 2
plan:
  project-key: ODSRV
  key: DMA
  name: demo mode acceptance
variables:
  release: "25.1"
  dockerApiVersion: "1.41"
stages:
- Demo mode tests:
    manual: false
    final: false
    jobs:
    - _Autoformatter check
    - _Static analysis
    - _Type_check
    - Comprehensive example
    - Distributed environment
    - Python access
    - Run in background
    - Run in foreground
    # TODO: VFS-13556 Uncomment after fixing the persistency tutorial
    # - Persistency

Comprehensive example:
  key: CEX
  other: &common-opts
    clean-working-dir: true
  tasks:
  - checkout: &checkout-default-repository
      path: onedata-acceptance
      force-clean-build: true
      description: Checkout Default Repository
  - script: &init-submodules
      interpreter: SHELL
      scripts:
      - |-
        git remote set-url origin ${bamboo.repository.git.repositoryUrl}
        git remote -v
        make submodules
      working-dir: onedata-acceptance
      description: Init submodules
  - script: &run-demo-mode-test
      interpreter: SHELL
      scripts:
      - make test_demo_mode RELEASE="${bamboo.release}" SCENARIO=test_comprehensive_example RUNNER_NAME="demo-mode-runner-${bamboo.buildResultKey}" DOCKER_API_VERSION="${bamboo.dockerApiVersion}"
      working-dir: onedata-acceptance
      description: Run demo mode test
  final-tasks: &final-tasks
  - test-parser:
      type: junit
      ignore-time: false
      test-results: onedata-acceptance/test-reports/results*.xml
      description: Parse test results
  - script:
      interpreter: SHELL
      scripts:
      - |-
        docker rm -f "demo-mode-runner-${bamboo.buildResultKey}" 2>/dev/null || true
        docker rm -f oz_test op_test1 op_test2 2>/dev/null || true
      description: Clean up demo mode containers
  requirements: &requirements
  - minikube
  artifacts: &command-log-artifacts
  - name: command-logs
    location: onedata-acceptance/tests/demo_mode/logs
    pattern: "**/*.log"
    shared: false
    required: false
  artifact-subscriptions: []

_Autoformatter check:
  key: BLFR
  other: *common-opts
  tasks:
  - checkout: *checkout-default-repository
  - script: &run-check
      interpreter: SHELL
      scripts:
      - make black-check
      working-dir: onedata-acceptance
      description: Black formatting
  artifact-subscriptions: []

_Static analysis:
  key: STAN
  other: *common-opts
  tasks:
  - checkout: *checkout-default-repository
  - script:
      <<: *run-check
      scripts:
      - make static-analysis
      description: Static analysis
  artifact-subscriptions: []

_Type_check:
  key: TCH
  other: *common-opts
  tasks:
  - checkout: *checkout-default-repository
  - script:
      <<: *run-check
      scripts:
      - make type-check
      description: Type checker
  artifact-subscriptions: []

Distributed environment:
  key: DISTENV
  other: *common-opts
  tasks:
  - checkout: *checkout-default-repository
  - script: *init-submodules
  - script:
      <<: *run-demo-mode-test
      scripts:
      - make test_demo_mode RELEASE="${bamboo.release}" SCENARIO=test_distributed_environment RUNNER_NAME="demo-mode-runner-${bamboo.buildResultKey}" DOCKER_API_VERSION="${bamboo.dockerApiVersion}"
  final-tasks: *final-tasks
  requirements: *requirements
  artifacts: *command-log-artifacts
  artifact-subscriptions: []

