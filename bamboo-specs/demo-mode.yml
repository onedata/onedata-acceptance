Python access:
  key: PYACCESS
  other: *common-opts
  tasks:
  - checkout: *checkout-default-repository
  - script: *init-submodules
  - script:
      <<: *run-demo-mode-test
      scripts:
      - make test_demo_mode RELEASE="${bamboo.release}" SCENARIO=test_python_access RUNNER_NAME="demo-mode-runner-${bamboo.buildResultKey}" DOCKER_API_VERSION="${bamboo.dockerApiVersion}"
  final-tasks: *final-tasks
  requirements: *requirements
  artifacts: *command-log-artifacts
  artifact-subscriptions: []

Run in background:
  key: BACKGROUND
  other: *common-opts
  tasks:
  - checkout: *checkout-default-repository
  - script: *init-submodules
  - script:
      <<: *run-demo-mode-test
      scripts:
      - make test_demo_mode RELEASE="${bamboo.release}" SCENARIO=test_run_in_background RUNNER_NAME="demo-mode-runner-${bamboo.buildResultKey}" DOCKER_API_VERSION="${bamboo.dockerApiVersion}"
  final-tasks: *final-tasks
  requirements: *requirements
  artifacts: *command-log-artifacts
  artifact-subscriptions: []

Run in foreground:
  key: FOREGROUND
  other: *common-opts
  tasks:
  - checkout: *checkout-default-repository
  - script: *init-submodules
  - script:
      <<: *run-demo-mode-test
      scripts:
      - make test_demo_mode RELEASE="${bamboo.release}" SCENARIO=test_run_in_foreground RUNNER_NAME="demo-mode-runner-${bamboo.buildResultKey}" DOCKER_API_VERSION="${bamboo.dockerApiVersion}"
  final-tasks: *final-tasks
  requirements: *requirements
  artifacts: *command-log-artifacts
  artifact-subscriptions: []

repositories:
- onedata-acceptance:
    scope: global
triggers: []
branches:
  create: manually
  delete: never
  link-to-jira: true
notifications: []
labels: []
dependencies:
  require-all-stages-passing: false
  enabled-for-branches: true
  block-strategy: none
  plans: []
other:
  concurrent-build-plugin: system-default
