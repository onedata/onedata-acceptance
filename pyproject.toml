# Ruff policy for the OneData acceptance tests. It follows the core Ruff
# policy from the OneData Python tooling handbook and adds compatibility rules
# for diagnostics enabled by the former Pylint configuration.

[tool.ruff]
line-length = 100
target-version = "py312"
output-format = "pylint"

[tool.ruff.lint]
# OneData handbook core. Keep this list identical to the Python project
# templates in onedata-dev-documentation.
select = ["E", "W", "F", "I", "UP", "B", "SIM", "PL"]

# Preview is needed only for Ruff implementations of checks that were already
# stable and enabled in Pylint 4.0.6. Prefix selectors cannot implicitly add
# any other preview rules.
preview = true
explicit-preview-rules = true

# Pylint has separate patterns for dummy variables, ignored arguments and
# callbacks; Ruff uses one pattern for all unused-name checks.
dummy-variable-rgx = "^(_+|_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?|dummy[a-zA-Z0-9_]*|ignored_[a-zA-Z0-9_]*|unused_[a-zA-Z0-9_]*|cb_[a-zA-Z0-9_]*|[a-zA-Z0-9_]+_cb)$"

# Compatibility extensions beyond the handbook core. Each group corresponds
# to checks enabled by the former Pylint policy.
extend-select = [
    # Reject variables that shadow builtins, preventing misleading calls and lookups.
    "A001",
    # Reject arguments that shadow builtins, keeping builtin operations accessible.
    "A002",
    # Reject class attributes that shadow builtins, avoiding ambiguous member access.
    "A003",
    # Reject imports that shadow builtins, preventing imported names from hiding them.
    "A004",
    # Reject lambda arguments that shadow builtins for the same reason as named arguments.
    "A006",

    # Report unused callable arguments, exposing stale APIs and mistaken fixture parameters.
    "ARG",

    # Reject broad exception handlers, so unexpected failures are not silently swallowed.
    "BLE001",
    # Reject raising Exception or BaseException directly, preserving meaningful error types.
    "TRY002",

    # Replace verbose or redundant comprehensions with clearer collection operations.
    "C4",
    # Replace loops that only append with comprehensions for clarity and efficiency.
    "PERF401",
    # Replace loops that only populate dictionaries with comprehensions.
    "PERF403",
    # Remove pass or ellipsis placeholders from blocks that already contain statements.
    "PIE790",
    # Reject repeated class fields, preventing an earlier definition from being overwritten.
    "PIE794",
    # Reject duplicate enum values, preventing accidental aliases.
    "PIE796",
    # Replace lambdas that merely call container constructors with the constructors.
    "PIE807",
    # Combine repeated startswith or endswith calls for readability and efficiency.
    "PIE810",

    # Require public-module docstrings, retaining the former Pylint documentation policy.
    "D100",
    # Reject empty docstrings because they document nothing while appearing intentional.
    "D419",

    # Replace joins of static strings with direct strings or f-strings for readability.
    "FLY002",
    # Enforce valid, lazy logging calls to avoid wasted formatting and malformed log records.
    "G",

    # Enforce CapWords class names, retaining the former Pylint naming policy.
    "N801",
    # Enforce snake_case function names, keeping callable naming consistent.
    "N802",
    # Enforce snake_case argument names, keeping function signatures consistent.
    "N803",
    # Require cls as a class-method first argument, making binding semantics explicit.
    "N804",
    # Require self as an instance-method first argument, making binding semantics explicit.
    "N805",
    # Enforce snake_case local variables, retaining the former Pylint naming policy.
    "N806",
    # Reject ordinary functions with dunder names, reserving them for Python protocols.
    "N807",
    # Enforce valid snake_case module names so modules import consistently across platforms.
    "N999",

    # Reject direct dunder calls, preferring operators and builtins with normal dispatch.
    "PLC2801",
    # Catch dictionary unpacking without items(), preventing invalid iteration results.
    "PLE1141",
    # Reject modifying a set during iteration, which otherwise raises RuntimeError.
    "PLE4703",
    # Find class methods missing @classmethod, preventing incorrect method binding.
    "PLR0202",
    # Find static methods missing @staticmethod, making state-independent methods explicit.
    "PLR0203",
    # Limit public methods so classes remain focused instead of becoming broad interfaces.
    "PLR0904",
    # Limit local variables because excessive function state makes logic hard to follow.
    "PLR0914",
    # Limit Boolean expressions so conditions remain understandable and maintainable.
    "PLR0916",
    # Limit nested blocks because deeply nested control flow obscures execution paths.
    "PLR1702",
    # Remove temporary variables used only to swap values, favoring direct tuple swaps.
    "PLR1712",
    # Reject inherited slot redefinitions that make the base slot inaccessible.
    "PLW0244",
    # Require text encodings so file behavior does not depend on the system locale.
    "PLW1514",

    # Make return paths explicit and consistent, reducing ambiguous None-returning control flow.
    "RET",
    # Remove empty exception-call parentheses when raising an exception class.
    "RSE102",

    # Reject non-integer literal indexes that would raise TypeError at runtime.
    "RUF016",

    # Flag exec because executing dynamic code can enable code injection.
    "S102",
    # Require request timeouts so network calls cannot hang indefinitely.
    "S113",
    # Flag eval because evaluating untrusted strings can execute arbitrary code.
    "S307",
    # Reject private-member access so code does not depend on unstable internals.
    "SLF001",
    # Reject committed debugger calls that would interrupt unattended test execution.
    "T100",
]

[tool.ruff.lint.isort]
known-first-party = [
    "bamboos",
    "cdmi_client",
    "onepanel_client",
    "oneprovider_client",
    "onezone_client",
]

[tool.ruff.lint.pylint]
# The former Pylint policy disabled the argument-count checks. Keep Ruff's
# existing, finite limits so the checks remain enabled without rejecting BDD
# step functions whose signatures are defined by fixtures.
max-args = 16

[tool.ruff.lint.per-file-ignores]
# Mirrors Pylint's init-import=no. Re-exporting package initializers are also
# the documented OneData convention.
"__init__.py" = ["F401"]

[tool.mypy]
python_version = "3.12"
warn_unused_configs = true        # flag a config/override section that matches no files
warn_unused_ignores = true        # flag a `# type: ignore` that no longer applies
warn_redundant_casts = true       # flag casts that do nothing
disallow_untyped_defs = true      # every function must be annotated
disallow_incomplete_defs = true   # …and partially-annotated functions are an error too
strict_equality = true            # flag comparisons between non-overlapping types
no_implicit_optional = true       # `x: int = None` is an error, not implicit Optional

# TODO: VFS-13659 uncomment after final typing fixes
# warn_return_any = true            # flag returning Any from a typed function

# TODO: VFS-13660 remove after final typing fixes
follow_imports = "skip"

pretty = true

[[tool.mypy.overrides]]
module = [
    "py.xml",
    "jsondiff",
    "environment",
    "environment.*",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = [
    "kubernetes",
    "kubernetes.*",
    "rpyc",
    "rpyc.*",
    "aiohttp_sse_client",
    "aiohttp_sse_client.*",
    "tests.utils.onenv_utils",
    "tests.utils.user_utils",
    "tests.mixed.utils.sse_utils",
]
ignore_missing_imports = true
disable_error_code = ["import-untyped"]

# TODO: VFS-13661 move all submodules into one place
# Ignore generated / external REST clients reported by mypy logs.
[[tool.mypy.overrides]]
module = [
    "onezone_client",
    "onezone_client.*",
    "onepanel_client",
    "onepanel_client.*",
    "oneprovider_client",
    "oneprovider_client.*",
    "cdmi_client",
    "cdmi_client.*",
    "tests.mixed.onezone_client",
    "tests.mixed.onezone_client.*",
    "tests.mixed.onepanel_client",
    "tests.mixed.onepanel_client.*",
    "tests.mixed.oneprovider_client",
    "tests.mixed.oneprovider_client.*",
    "tests.mixed.cdmi_client",
    "tests.mixed.cdmi_client.*",
]
ignore_missing_imports = true
ignore_errors = true
